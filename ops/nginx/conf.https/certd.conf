server {
    listen 80;
    server_name ssl.vuedj.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name ssl.vuedj.com;

    ssl_certificate /etc/nginx/ssl/vuedj.com.crt;   # 证书文件路径
    ssl_certificate_key /etc/nginx/ssl/vuedj.com.key;   # 私钥文件路径

    location / {
        proxy_pass http://certd:7001;  # ← 代理到 certd 的 HTTP 端口
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 告诉 certd 当前是 HTTPS

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;

        # 流式传输优化
        proxy_buffering off;
    }
}