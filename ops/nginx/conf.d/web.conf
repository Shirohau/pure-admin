include /etc/nginx/oa-proxy/forwarded-proto.conf;

# 代理日志
log_format json_proxy_log escape=json
'{'
  '"timestamp": "$time_iso8601", '
  '"referer": "$http_referer", '
  '"client": "$remote_addr", '
  '"client_port": $remote_port, '
  '"path": "$uri", '
  '"query_string": "$args", '
  '"request": "$request", '
  '"status": $status, '
  '"response_size": $body_bytes_sent, '
  '"upstream_addr": "$upstream_addr", '
  '"upstream_response_time": $upstream_response_time, '
  '"duration": $request_time, '
  '"user_agent": "$http_user_agent" '
'}';


# 监听 8080 端口
server {
    listen 8080;
    server_name localhost;

    # ==============================
    # ✅ 在 server 块中启用 Gzip 压缩（仅对本站点生效）
    # ==============================
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        font/woff2
        image/svg+xml;

    # 前端静态文件
    location ^~ /static/ {
        root /usr/share/nginx/html/web;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location = /index.html {
        root /usr/share/nginx/html/web;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location / {
        root /usr/share/nginx/html/web;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    # 代理 /api 到 Django
    location /api/ {
        access_log /var/log/nginx/access.proxy.json.log json_proxy_log;  # 使用 proxy_log 格式写入独立日志文件
        error_log  /var/log/nginx/error.proxy.log;

        # proxy_pass 末尾带 "/"，自动剥离 /api 前缀
        proxy_pass http://django:8000/;    # 将请求反向代理到后端服务

        # 传递关键头部给后端
        proxy_set_header X-Forwarded-Proto $oa_forwarded_proto; # 保留可信上游提供的原始协议
        proxy_set_header Host $http_host;    #  告诉后端原始请求使用的请求Host头，域名:端口
        proxy_set_header X-Real-IP $remote_addr; # 将客户端的真实 IP 地址传递给后端
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;  # 这行会自动追加 $remote_addr # 代理链 IP

        # 超时设置
        proxy_connect_timeout 60s;
        proxy_send_timeout 1200s;
        proxy_read_timeout 1200s;

        # 流式传输优化（适用于 SSE、大文件等）
        proxy_buffering off;
    }

    # 直接提供 media 文件
    location /media/ {
        alias /usr/share/nginx/html/media/;
        expires 1h;
        add_header Cache-Control "public";
    }
}
